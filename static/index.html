<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local AI Agents</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-elev: #161b22;
      --bg-soft: #1c2128;
      --border: #30363d;
      --border-soft: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-dim: #1f6feb33;
      --green: #3fb950;
      --green-bg: #23863622;
      --red: #f85149;
      --red-bg: #da363322;
      --yellow: #d29922;
      --purple: #a371f7;
      --cyan: #39c5cf;
      --radius: 10px;
      --font: "Segoe UI", "Cascadia Code", "Consolas", system-ui, sans-serif;
      --mono: "Cascadia Code", "Consolas", "Courier New", monospace;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2332 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, #141c2b 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      cursor: pointer; border: 1px solid var(--border);
      background: var(--bg-soft); color: var(--text);
      border-radius: 8px; padding: 8px 14px;
      transition: background .15s, border-color .15s, transform .1s;
    }
    button:hover { background: #2a313a; border-color: #484f58; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    button.primary {
      background: #238636; border-color: #2ea043; color: #fff; font-weight: 600;
    }
    button.primary:hover { background: #2ea043; }
    button.danger {
      background: #21262d; border-color: #f85149; color: #f85149;
    }
    button.danger:hover { background: #da363322; }
    input[type="text"], textarea, select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; outline: none; width: 100%;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
    }
    textarea { resize: vertical; min-height: 72px; }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      max-height: 100vh;
    }

    /* Top bar */
    .topbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(22,27,34,.92); backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 20;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-right: 8px;
      font-weight: 700; letter-spacing: .2px;
    }
    .brand .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #58a6ff, #a371f7);
      display: grid; place-items: center; font-size: 14px; color: #0d1117;
      font-weight: 800;
    }
    .model-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg);
      max-width: 280px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.on { background: var(--green); box-shadow: 0 0 8px #3fb950aa; }
    .dot.off { background: var(--red); }
    .model-pill .name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-family: var(--mono); font-size: 12px;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 1;
    }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
    .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .field.grow { flex: 1; min-width: 180px; }
    .check {
      display: flex; align-items: center; gap: 8px;
      padding-top: 16px; color: var(--muted); font-size: 13px;
      user-select: none;
    }
    .actions { display: flex; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
    .tokens {
      margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
      padding-top: 16px; white-space: nowrap;
      display: flex; gap: 10px; align-items: center;
    }
    .tok-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--cyan); font-family: var(--mono); font-size: 11.5px;
      min-width: 4.5em; justify-content: center;
    }
    .tok-badge.empty { color: var(--muted); }
    .ctx-meter {
      display: inline-flex; flex-direction: column; gap: 3px;
      min-width: 140px; max-width: 200px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .ctx-meter .ctx-label { white-space: nowrap; }
    .ctx-meter .ctx-track {
      height: 6px; border-radius: 999px; background: var(--border-soft);
      overflow: hidden; border: 1px solid var(--border);
    }
    .ctx-meter .ctx-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: var(--green); transition: width .25s ease, background .25s ease;
    }
    .ctx-meter.warn .ctx-fill { background: var(--yellow); }
    .ctx-meter.crit .ctx-fill { background: var(--red); }
    .ctx-meter.warn .ctx-label { color: var(--yellow); }
    .ctx-meter.crit .ctx-label { color: var(--red); }
    .role-models {
      display: none; flex-wrap: wrap; gap: 10px; width: 100%;
      padding: 4px 0 0;
    }
    .role-models.show { display: flex; }
    .role-models .field { min-width: 140px; flex: 1; }
    button.ghost {
      background: transparent; border-color: var(--border); color: var(--muted);
      font-size: 12px; padding: 8px 12px;
    }
    button.ghost:hover { color: var(--text); border-color: #484f58; }
    button.ghost.active-session {
      border-color: var(--accent); color: var(--accent);
    }
    .presets {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    }
    button.preset {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: var(--bg); color: var(--muted);
    }
    button.preset:hover { color: var(--accent); border-color: #58a6ff55; }

    /* Main layout */
    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      min-height: 0; height: 100%;
    }
    @media (max-width: 960px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 1fr 40vh; }
    }

    .feed-wrap {
      display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border);
    }
    .task-row {
      padding: 12px 16px; border-bottom: 1px solid var(--border-soft);
      background: var(--bg-elev);
    }
    .feed {
      flex: 1; overflow: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .feed:empty::before {
      content: "Запустите задачу — здесь появится живой поток шагов";
      color: var(--muted); margin: auto; text-align: center;
    }

    .card {
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      box-shadow: var(--shadow); animation: rise .25s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .card-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .icon {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center; font-size: 13px; flex-shrink: 0;
      background: var(--bg-soft); border: 1px solid var(--border);
    }
    .card-title { font-weight: 600; }
    .card-meta { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
    .card-body {
      color: var(--text); white-space: pre-wrap; word-break: break-word;
      font-family: var(--mono); font-size: 12.5px; line-height: 1.45;
    }
    .card.thought .icon { color: var(--cyan); border-color: #39c5cf44; }
    .card.reasoning .icon { color: var(--purple); border-color: #a371f744; }
    .card.tool .icon { color: var(--yellow); border-color: #d2992244; }
    .card.result .icon { color: var(--green); border-color: #3fb95044; }
    .card.error .icon { color: var(--red); border-color: #f8514944; }
    .card.final .icon { color: var(--purple); border-color: #a371f744; }
    .card.tokens .icon { color: var(--accent); }
    .card.step {
      background: transparent; border-style: dashed; box-shadow: none;
      padding: 6px 10px; color: var(--muted); font-size: 12px;
    }
    .card.reasoning details { margin: 0; }
    .card.reasoning summary {
      cursor: pointer; color: var(--muted); font-size: 12px;
      list-style: none; user-select: none;
    }
    .card.reasoning summary::-webkit-details-marker { display: none; }
    .card.reasoning summary::before {
      content: "▸ "; color: var(--purple); font-family: var(--mono);
    }
    .card.reasoning details[open] summary::before { content: "▾ "; }
    .card.reasoning .card-body { margin-top: 8px; color: var(--muted); }

    .diff-unified {
      margin-top: 8px; border-radius: 8px; border: 1px solid var(--border);
      overflow: auto; max-height: 280px; background: var(--bg);
      font-family: var(--mono); font-size: 12px; line-height: 1.45;
    }
    .diff-unified .dline { padding: 1px 10px; white-space: pre-wrap; word-break: break-word; }
    .diff-unified .d-add { background: var(--green-bg); color: var(--green); }
    .diff-unified .d-del { background: var(--red-bg); color: var(--red); }
    .diff-unified .d-hunk { color: var(--accent); background: var(--accent-dim); }
    .diff-unified .d-meta { color: var(--muted); }
    .diff-empty { color: var(--muted); padding: 8px 10px; font-style: italic; }

    .step-hud {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      font-family: var(--mono); font-size: 12px; color: var(--muted);
      white-space: nowrap;
    }
    .step-hud.active { color: var(--accent); border-color: #58a6ff55; }

    /* Right panel */
    .side {
      display: grid; grid-template-rows: minmax(110px, 0.55fr) 1fr 1.1fr minmax(100px, 0.65fr);
      min-height: 0; background: var(--bg-elev);
    }
    .sessions {
      flex: 1; overflow: auto; padding: 6px 8px;
      font-family: var(--mono); font-size: 11.5px;
    }
    .session-item {
      display: grid; grid-template-columns: 1fr auto;
      gap: 4px; align-items: start;
      padding: 6px 8px; border-radius: 6px;
      border: 1px solid transparent; cursor: pointer;
    }
    .session-item:hover { background: var(--bg-soft); border-color: var(--border-soft); }
    .session-item.active { background: var(--accent-dim); border-color: #58a6ff55; }
    .session-meta { overflow: hidden; min-width: 0; }
    .session-meta .title {
      color: var(--text); display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-meta .sub { color: var(--muted); font-size: 10.5px; }
    .session-item button.del {
      font-size: 11px; padding: 2px 6px; color: var(--red);
      border-color: transparent; background: transparent;
    }
    .session-item button.del:hover { border-color: var(--red); background: var(--red-bg); }
    .panel {
      display: flex; flex-direction: column; min-height: 0;
      border-bottom: 1px solid var(--border);
    }
    .panel:last-child { border-bottom: none; }
    .backups {
      flex: 1; overflow: auto; padding: 6px 8px;
      font-family: var(--mono); font-size: 11.5px;
    }
    .backup-item {
      display: grid; grid-template-columns: 1fr auto;
      gap: 6px; align-items: center;
      padding: 6px 8px; border-radius: 6px;
      border: 1px solid transparent;
    }
    .backup-item:hover { background: var(--bg-soft); border-color: var(--border-soft); }
    .backup-meta { color: var(--muted); overflow: hidden; }
    .backup-meta .orig { color: var(--text); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .backup-meta .stamp { font-size: 10.5px; }
    .backup-item button {
      font-size: 11px; padding: 4px 8px; white-space: nowrap;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--border-soft);
      font-weight: 600; font-size: 13px;
    }
    .panel-head span.muted { color: var(--muted); font-weight: 400; font-size: 11px; }
    .tree {
      flex: 1; overflow: auto; padding: 8px;
      font-family: var(--mono); font-size: 12px;
    }
    .tree-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border-radius: 6px; cursor: pointer;
      color: var(--muted);
    }
    .tree-item:hover { background: var(--bg-soft); color: var(--text); }
    .tree-item.active { background: var(--accent-dim); color: var(--accent); }
    .tree-item.dir { cursor: default; color: var(--text); font-weight: 600; }
    .viewer {
      flex: 1; overflow: auto; position: relative;
      background: var(--bg);
    }
    .viewer-empty {
      color: var(--muted); padding: 24px; text-align: center;
    }
    .code-view {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
      min-height: 100%; min-width: 0;
    }
    .line-nums {
      padding: 12px 8px 12px 12px; text-align: right; color: #484f58;
      user-select: none; border-right: 1px solid var(--border-soft);
      background: #0d1117; white-space: pre;
    }
    .line-code {
      padding: 12px 12px 12px 10px; white-space: pre; overflow-x: auto;
      color: var(--text); min-width: 0;
    }
    .copy-btn { font-size: 12px; padding: 4px 8px; }

    .status-bar {
      padding: 6px 16px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 12px;
      display: flex; gap: 16px; background: var(--bg-elev);
    }

    .mention-wrap { position: relative; }
    .mention-menu {
      display: none; position: absolute; left: 0; right: 0; bottom: 100%;
      max-height: 220px; overflow: auto; z-index: 40;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 4px;
    }
    .mention-menu.open { display: block; }
    .mention-item {
      padding: 8px 12px; cursor: pointer; font-family: var(--mono); font-size: 12px;
      display: flex; gap: 8px; align-items: baseline;
      border-bottom: 1px solid var(--border-soft);
    }
    .mention-item:last-child { border-bottom: none; }
    .mention-item.active, .mention-item:hover {
      background: var(--accent-dim); color: var(--accent);
    }
    .mention-item .kind {
      color: var(--muted); font-size: 10px; text-transform: uppercase;
      font-family: var(--font); min-width: 52px;
    }

    .changes-bar {
      display: none; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 8px 16px; border-bottom: 1px solid var(--border-soft);
      background: linear-gradient(90deg, #1a2332 0%, var(--bg-elev) 60%);
      font-size: 12.5px;
    }
    .changes-bar.show { display: flex; }
    .changes-bar .stats { font-family: var(--mono); color: var(--muted); }
    .changes-bar .stats .plus { color: var(--green); }
    .changes-bar .stats .minus { color: var(--red); }
    .changes-bar .files {
      flex: 1; min-width: 120px; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .changes-bar button { font-size: 12px; padding: 4px 10px; }
    .file-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--accent); font-family: var(--mono); font-size: 11.5px;
      cursor: pointer; max-width: 220px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-pill:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* Diff modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(1, 4, 9, .72); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(1100px, 100%); max-height: min(86vh, 900px);
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .modal-head h2 {
      margin: 0; font-size: 14px; font-weight: 600;
      font-family: var(--mono); overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1;
    }
    .modal-tabs { display: flex; gap: 6px; }
    .modal-tabs button.active {
      border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
    }
    .modal-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
    .diff-split {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0;
    }
    @media (max-width: 800px) {
      .diff-split { grid-template-columns: 1fr; }
    }
    .diff-pane {
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
      overflow: auto; max-height: 60vh;
    }
    .diff-pane .pane-title {
      position: sticky; top: 0; padding: 6px 10px;
      background: var(--bg-soft); border-bottom: 1px solid var(--border);
      color: var(--muted); font-size: 11px; font-family: var(--mono);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .diff-pane pre {
      margin: 0; padding: 10px; white-space: pre-wrap; word-break: break-word;
      font-family: var(--mono); font-size: 12px; line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">LA</div>
        <div>Local AI Agents</div>
      </div>
      <div class="model-pill" title="Активная модель LM Studio">
        <span class="dot" id="modelDot"></span>
        <span class="name" id="modelName">подключение…</span>
      </div>
      <div class="controls">
        <div class="field">
          <label>Режим</label>
          <select id="mode">
            <option value="agent">Agent</option>
            <option value="workflow">Workflow</option>
            <option value="multi_agent">Multi-Agent</option>
          </select>
        </div>
        <div class="field grow">
          <label>Workspace</label>
          <input type="text" id="workspace" value="./sandbox" />
        </div>
        <div class="field grow">
          <label>API Base URL</label>
          <input type="text" id="baseUrl" value="http://localhost:1234/v1" placeholder="http://localhost:1234/v1" />
        </div>
        <div class="field" style="min-width:90px">
          <label>Max steps</label>
          <input type="text" id="maxSteps" value="12" />
        </div>
        <label class="check">
          <input type="checkbox" id="clean" />
          Очистить sandbox перед стартом
        </label>
        <label class="check" title="Если правили .py и не гоняли pytest — автозапуск + один цикл самоисправления">
          <input type="checkbox" id="autoTest" />
          Auto-test (pytest)
        </label>
        <div class="actions">
          <button class="primary" id="btnRun">Запустить</button>
          <button class="danger" id="btnStop" disabled>Остановить</button>
          <button class="ghost" id="btnNewSession" title="Очистить историю диалога Agent">Новый сеанс</button>
        </div>
        <div class="step-hud" id="stepHud" title="Прогресс шагов">Шаг — / —</div>
        <div class="tokens">
          <div class="ctx-meter" id="ctxMeter" title="Context window (prompt_tokens / LLM_CONTEXT_LIMIT)">
            <span class="ctx-label" id="ctxLabel">ctx: — / —</span>
            <div class="ctx-track"><div class="ctx-fill" id="ctxFill"></div></div>
          </div>
          <span id="tokenHud">tokens: 0 / 0</span>
          <span class="tok-badge empty" id="tokSpeed" title="Скорость генерации">— tok/s</span>
        </div>
        <div class="role-models" id="roleModels">
          <div class="field">
            <label>Architect model</label>
            <input type="text" id="modelArchitect" placeholder="(активная)" />
          </div>
          <div class="field">
            <label>Coder model</label>
            <input type="text" id="modelCoder" placeholder="(активная)" />
          </div>
          <div class="field">
            <label>Reviewer model</label>
            <input type="text" id="modelReviewer" placeholder="(активная)" />
          </div>
        </div>
      </div>
    </header>

    <div class="main">
      <section class="feed-wrap">
        <div class="task-row">
          <div class="field">
            <label>Задача <span class="muted" id="sessionHint" style="text-transform:none;letter-spacing:0;font-weight:400"></span></label>
            <div class="presets" id="presets">
              <button type="button" class="preset" data-preset="script">Скрипт + тесты</button>
              <button type="button" class="preset" data-preset="refactor">Рефакторинг файла</button>
              <button type="button" class="preset" data-preset="tests">Тесты / pytest</button>
            </div>
            <div class="mention-wrap">
              <textarea id="task" placeholder="Опиши задачу… Набери @ для файлов, @repo_map, @git_diff"></textarea>
              <div class="mention-menu" id="mentionMenu" role="listbox"></div>
            </div>
          </div>
        </div>
        <div class="changes-bar" id="changesBar">
          <strong>Session Changes</strong>
          <span class="stats" id="changesStats">+0 / −0</span>
          <span class="files" id="changesFiles" title=""></span>
          <button type="button" class="danger" id="btnRevertSession" title="Откатить все файлы сессии к первому бэкапу">Revert All Session Changes</button>
        </div>
        <div class="feed" id="feed"></div>
        <div class="status-bar">
          <span id="connStatus">SSE: …</span>
          <span id="runStatus">idle</span>
          <span id="wsPath"></span>
        </div>
      </section>

      <aside class="side">
        <div class="panel">
          <div class="panel-head">
            Сессии
            <span class="muted" id="sessionCount">0</span>
          </div>
          <div class="sessions" id="sessionsList">
            <div class="viewer-empty">нет сохранённых сессий</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head">
            Файлы
            <span class="muted" id="fileCount">0</span>
          </div>
          <div class="tree" id="tree"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <span id="viewerTitle">Просмотр</span>
            <button class="copy-btn" id="btnCopy" disabled>Копировать</button>
          </div>
          <div class="viewer" id="viewer">
            <div class="viewer-empty">Выберите файл в дереве</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head">
            Бэкапы
            <span class="muted" id="backupCount">0</span>
          </div>
          <div class="backups" id="backups">
            <div class="viewer-empty">нет сохранённых версий</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal-backdrop" id="diffModal" role="dialog" aria-modal="true" aria-labelledby="diffModalTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="diffModalTitle">Diff</h2>
        <div class="modal-tabs">
          <button type="button" class="ghost active" id="diffTabUnified">Unified</button>
          <button type="button" class="ghost" id="diffTabSplit">Side-by-side</button>
        </div>
        <button type="button" class="ghost" id="diffModalClose" title="Закрыть">✕</button>
      </div>
      <div class="modal-body" id="diffModalBody"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const feed = $("feed");
    const tree = $("tree");
    const viewer = $("viewer");
    const backupsEl = $("backups");
    let currentFile = null;
    let currentContent = "";
    let autoScroll = true;
    let promptTokens = 0;
    let completionTokens = 0;
    let lastTokPerSec = null;
    let lastPromptTokens = 0;
    let contextLimit = 32768;
    let lastThoughtKey = null;
    let lastToolName = null;
    let currentStep = 0;
    let currentMaxSteps = 12;
    let sessionActive = false;
    let activeSessionId = null;
    let sessionChangeFiles = [];
    let activeReasoningEl = null;
    let diffModalData = null;
    let diffModalMode = "unified";
    let mentionTargets = [];
    let mentionOpen = false;
    let mentionIndex = 0;
    let mentionFiltered = [];
    let mentionQuery = "";
    let mentionAtPos = -1;
    let autoTestUserTouched = false;
    const runStart = { t: 0 };

    const PRESETS = {
      script:
        "Напиши Python-скрипт по задаче ниже и рядом файл тестов (test_*.py). " +
        "Прогони тесты через run_command (pytest -q) и кратко опиши результат.\n\nЗадача: ",
      refactor:
        "Открой указанный файл через read_file, кратко опиши структуру, " +
        "предложи и выполни рефакторинг через write_file (полная перезапись), " +
        "затем проверь через run_command (pytest / python script.py).\n\nФайл: @",
      tests:
        "Найди Python-файлы через list_files, прочитай нужные через read_file, " +
        "добавь/обнови тесты (test_*.py) через write_file и прогони pytest -q.\n\nФокус: ",
    };

    function fmtTime(ts) {
      const d = new Date((ts || Date.now() / 1000) * 1000);
      return d.toLocaleTimeString("ru-RU", { hour12: false });
    }

    function elapsed() {
      if (!runStart.t) return "";
      const ms = Date.now() - runStart.t;
      return (ms / 1000).toFixed(1) + "s";
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function short(s, n = 4000) {
      s = String(s ?? "");
      return s.length > n ? s.slice(0, n) + "\n… [" + s.length + " chars]" : s;
    }

    function getBaseUrl() {
      return ($("baseUrl").value || "").trim() || "http://localhost:1234/v1";
    }

    function updateStepHud(step, maxSteps) {
      if (step != null) currentStep = step;
      if (maxSteps != null) currentMaxSteps = maxSteps;
      const hud = $("stepHud");
      const label = "Шаг " + (currentStep || "—") + " / " + (currentMaxSteps || "—");
      hud.textContent = label;
      hud.classList.toggle("active", !!runStart.t && $("btnStop").disabled === false);
    }

    function addCard(opts) {
      const el = document.createElement("div");
      el.className = "card " + (opts.cls || "");
      if (opts.cls === "step") {
        el.textContent = opts.title || "";
        feed.appendChild(el);
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        return el;
      }
      el.innerHTML =
        '<div class="card-head">' +
          '<div class="icon">' + (opts.icon || "•") + "</div>" +
          '<div class="card-title">' + esc(opts.title || "") + "</div>" +
          '<div class="card-meta">' + esc(opts.meta || fmtTime(opts.ts)) + "</div>" +
        "</div>" +
        (opts.bodyHtml
          ? '<div class="card-body">' + opts.bodyHtml + "</div>"
          : opts.body
            ? '<div class="card-body">' + esc(opts.body) + "</div>"
            : "");
      feed.appendChild(el);
      if (autoScroll) feed.scrollTop = feed.scrollHeight;
      return el;
    }

    function makeUnifiedDiffHtml(diffText) {
      const raw = String(diffText || "").trim();
      if (!raw) {
        return '<div class="diff-unified"><div class="diff-empty">(нет изменений)</div></div>';
      }
      const lines = short(raw, 8000).split("\n");
      let html = '<div class="diff-unified">';
      for (const line of lines) {
        let cls = "d-meta";
        if (line.startsWith("+++") || line.startsWith("---")) cls = "d-meta";
        else if (line.startsWith("@@")) cls = "d-hunk";
        else if (line.startsWith("+")) cls = "d-add";
        else if (line.startsWith("-")) cls = "d-del";
        else cls = "d-meta";
        html += '<div class="dline ' + cls + '">' + esc(line) + "</div>";
      }
      html += "</div>";
      return html;
    }

    function updateTokens() {
      $("tokenHud").textContent =
        "tokens: " + promptTokens + " / " + completionTokens;
      const badge = $("tokSpeed");
      if (lastTokPerSec != null && !Number.isNaN(lastTokPerSec)) {
        badge.textContent = lastTokPerSec.toFixed(1) + " tok/s";
        badge.classList.remove("empty");
      } else {
        badge.textContent = "— tok/s";
        badge.classList.add("empty");
      }
      updateContextMeter(lastPromptTokens, contextLimit);
    }

    function updateContextMeter(prompt, limit) {
      const meter = $("ctxMeter");
      const label = $("ctxLabel");
      const fill = $("ctxFill");
      if (!meter || !label || !fill) return;
      const lim = Number(limit) > 0 ? Number(limit) : 32768;
      contextLimit = lim;
      const p = Math.max(0, Number(prompt) || 0);
      lastPromptTokens = p;
      const pct = Math.min(100, (p / lim) * 100);
      label.textContent = "ctx: " + p + " / " + lim + " (" + pct.toFixed(0) + "%)";
      fill.style.width = pct.toFixed(1) + "%";
      meter.classList.remove("warn", "crit");
      if (pct >= 90) meter.classList.add("crit");
      else if (pct >= 75) meter.classList.add("warn");
      meter.title =
        "Context window usage: " + p + " / " + lim +
        " (LLM_CONTEXT_LIMIT). Warning ≥75%, critical ≥90%.";
    }

    function upsertReasoningCard(content, opts) {
      const active = !!(opts && opts.active);
      const agent = (opts && opts.agent) || "";
      const meta = (opts && opts.meta) || "";
      if (activeReasoningEl && activeReasoningEl.isConnected) {
        const body = activeReasoningEl.querySelector(".card-body");
        const details = activeReasoningEl.querySelector("details");
        const title = activeReasoningEl.querySelector(".card-title");
        if (body) body.textContent = short(content, 6000);
        if (title) {
          title.textContent =
            "Reasoning / Think" + (agent ? " · " + agent : "") +
            (active ? " · live" : "");
        }
        if (details) details.open = !!active;
        if (!active) activeReasoningEl = null;
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        return activeReasoningEl;
      }
      const el = document.createElement("div");
      el.className = "card reasoning";
      el.innerHTML =
        '<div class="card-head">' +
          '<div class="icon">🧠</div>' +
          '<div class="card-title">Reasoning / Think' +
            (agent ? " · " + esc(agent) : "") +
            (active ? " · live" : "") +
          "</div>" +
          '<div class="card-meta">' + esc(meta || fmtTime()) + "</div>" +
        "</div>" +
        "<details" + (active ? " open" : "") + ">" +
          "<summary>Показать рассуждение модели</summary>" +
          '<div class="card-body">' + esc(short(content, 6000)) + "</div>" +
        "</details>";
      feed.appendChild(el);
      if (autoScroll) feed.scrollTop = feed.scrollHeight;
      activeReasoningEl = active ? el : null;
      return el;
    }

    function closeDiffModal() {
      $("diffModal").classList.remove("open");
      diffModalData = null;
    }

    function renderDiffModal() {
      const body = $("diffModalBody");
      if (!diffModalData) {
        body.innerHTML = '<div class="diff-empty">нет данных</div>';
        return;
      }
      $("diffModalTitle").textContent =
        "Diff · " + (diffModalData.filename || "?") +
        (diffModalData.backup ? "  ←  " + diffModalData.backup : "  (new file)");
      $("diffTabUnified").classList.toggle("active", diffModalMode === "unified");
      $("diffTabSplit").classList.toggle("active", diffModalMode === "split");
      if (diffModalMode === "split") {
        body.innerHTML =
          '<div class="diff-split">' +
            '<div class="diff-pane">' +
              '<div class="pane-title">Initial (session backup)</div>' +
              "<pre>" + esc(diffModalData.before || "(empty)") + "</pre>" +
            "</div>" +
            '<div class="diff-pane">' +
              '<div class="pane-title">Current</div>' +
              "<pre>" + esc(diffModalData.after || "(empty / deleted)") + "</pre>" +
            "</div>" +
          "</div>";
      } else {
        body.innerHTML = makeUnifiedDiffHtml(diffModalData.diff || "");
      }
    }

    async function openSessionFileDiff(filename) {
      if (!activeSessionId || !filename) return;
      try {
        const url =
          "/api/sessions/" + encodeURIComponent(activeSessionId) +
          "/diff?path=" + encodeURIComponent(filename);
        const r = await fetch(url);
        const data = await r.json();
        if (!data.ok) {
          addCard({
            cls: "error",
            icon: "⚠",
            title: "Diff",
            body: data.error || "не удалось загрузить diff",
          });
          return;
        }
        diffModalData = data;
        diffModalMode = "unified";
        renderDiffModal();
        $("diffModal").classList.add("open");
      } catch (e) {
        addCard({ cls: "error", icon: "⚠", title: "Diff", body: String(e) });
      }
    }

    function toggleRoleModels() {
      const on = $("mode").value === "multi_agent";
      $("roleModels").classList.toggle("show", on);
    }

    function setRunning(on) {
      $("btnRun").disabled = !!on;
      $("btnStop").disabled = !on;
      $("btnNewSession").disabled = !!on;
      $("runStatus").textContent = on ? "running…" : "idle";
      $("stepHud").classList.toggle("active", !!on);
    }

    function updateSessionHint(info) {
      if (info && typeof info.active === "boolean") sessionActive = info.active;
      if (info && info.session_id) activeSessionId = info.session_id;
      if (info && info.tokens_per_sec != null) {
        lastTokPerSec = Number(info.tokens_per_sec);
        updateTokens();
      }
      const hint = $("sessionHint");
      const btn = $("btnNewSession");
      if (sessionActive) {
        const n = (info && info.messages) || "";
        hint.textContent = n ? "(сеанс · " + n + " msg — уточнение продолжит диалог)" : "(сеанс активен)";
        btn.classList.add("active-session");
      } else {
        hint.textContent = "";
        btn.classList.remove("active-session");
      }
      markActiveSession();
    }

    function markActiveSession() {
      const list = $("sessionsList");
      if (!list) return;
      [...list.querySelectorAll(".session-item")].forEach((el) => {
        el.classList.toggle("active", el.dataset.id === activeSessionId);
      });
    }

    function fmtSessionTime(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        return d.toLocaleString("ru-RU", { hour12: false });
      } catch (_) {
        return iso;
      }
    }

    async function refreshSessions() {
      try {
        const r = await fetch("/api/sessions");
        const data = await r.json();
        const list = data.sessions || [];
        $("sessionCount").textContent = String(list.length);
        const el = $("sessionsList");
        el.innerHTML = "";
        if (!list.length) {
          el.innerHTML = '<div class="viewer-empty">нет сохранённых сессий</div>';
          return;
        }
        for (const s of list) {
          const row = document.createElement("div");
          row.className = "session-item" + (s.session_id === activeSessionId ? " active" : "");
          row.dataset.id = s.session_id;
          const meta = document.createElement("div");
          meta.className = "session-meta";
          meta.innerHTML =
            '<span class="title" title="' + esc(s.title || "") + '">' + esc(s.title || "Untitled") + "</span>" +
            '<span class="sub">' + esc(s.mode || "") +
            " · " + (s.message_count || 0) + " msg · " +
            esc(fmtSessionTime(s.updated_at)) + "</span>";
          meta.onclick = () => loadSession(s.session_id);
          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "×";
          del.title = "Удалить сессию";
          del.onclick = (e) => {
            e.stopPropagation();
            deleteSession(s.session_id);
          };
          row.appendChild(meta);
          row.appendChild(del);
          el.appendChild(row);
        }
      } catch (_) {
        $("sessionsList").innerHTML = '<div class="viewer-empty">ошибка загрузки</div>';
      }
    }

    async function loadSession(id) {
      if (!id) return;
      try {
        const r = await fetch("/api/sessions/" + encodeURIComponent(id) + "/load", {
          method: "POST",
        });
        const data = await r.json();
        if (!data.ok) {
          addCard({ cls: "error", icon: "⚠", title: "Сессия", body: data.error || "не найдена" });
          return;
        }
        activeSessionId = id;
        updateSessionHint(data);
        if (data.changes) updateChangesBar(data.changes);
        addCard({
          cls: "step",
          title: "↩ Загружена сессия · " + short(data.title || id, 80),
        });
        markActiveSession();
      } catch (e) {
        addCard({ cls: "error", icon: "⚠", title: "Сессия", body: String(e) });
      }
    }

    async function deleteSession(id) {
      if (!id) return;
      if (!confirm("Удалить сохранённую сессию?")) return;
      try {
        const r = await fetch("/api/sessions/" + encodeURIComponent(id), {
          method: "DELETE",
        });
        const data = await r.json();
        if (!data.ok) {
          addCard({ cls: "error", icon: "⚠", title: "Сессия", body: data.error || "ошибка" });
          return;
        }
        if (activeSessionId === id) activeSessionId = null;
        refreshSessions();
        refreshSession();
      } catch (e) {
        addCard({ cls: "error", icon: "⚠", title: "Сессия", body: String(e) });
      }
    }

    async function refreshModel() {
      try {
        const base = encodeURIComponent(getBaseUrl());
        const r = await fetch("/api/model?base_url=" + base);
        const data = await r.json();
        const dot = $("modelDot");
        if (data.ok && data.model) {
          $("modelName").textContent = data.model;
          dot.className = "dot on";
        } else {
          $("modelName").textContent = data.error || "шлюз недоступен";
          dot.className = "dot off";
        }
      } catch (e) {
        $("modelName").textContent = "нет связи";
        $("modelDot").className = "dot off";
      }
    }

    function updateChangesBar(changes) {
      const bar = $("changesBar");
      const filesEl = $("changesFiles");
      if (!changes || !changes.file_count) {
        bar.classList.remove("show");
        $("changesStats").innerHTML = '<span class="plus">+0</span> / <span class="minus">−0</span>';
        filesEl.innerHTML = "";
        sessionChangeFiles = [];
        return;
      }
      bar.classList.add("show");
      const added = changes.added || 0;
      const removed = changes.removed || 0;
      $("changesStats").innerHTML =
        '<span class="plus">+' + added + "</span> / <span class=\"minus\">−" + removed + "</span>";
      sessionChangeFiles = (changes.files || []).map((f) => f.filename).filter(Boolean);
      filesEl.innerHTML = "";
      sessionChangeFiles.forEach((name) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "file-pill";
        pill.textContent = name;
        pill.title = "Открыть diff: " + name;
        pill.onclick = () => openSessionFileDiff(name);
        filesEl.appendChild(pill);
      });
    }

    function renderMentionMenu() {
      const menu = $("mentionMenu");
      if (!mentionOpen || !mentionFiltered.length) {
        menu.classList.remove("open");
        menu.innerHTML = "";
        return;
      }
      menu.innerHTML = "";
      mentionFiltered.forEach((t, i) => {
        const el = document.createElement("div");
        el.className = "mention-item" + (i === mentionIndex ? " active" : "");
        el.setAttribute("role", "option");
        el.innerHTML =
          '<span class="kind">' + esc(t.kind || "file") + "</span>" +
          "<span>" + esc(t.label || ("@" + t.id)) + "</span>";
        el.onmousedown = (ev) => {
          ev.preventDefault();
          applyMention(i);
        };
        menu.appendChild(el);
      });
      menu.classList.add("open");
      const active = menu.querySelector(".mention-item.active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }

    function closeMentionMenu() {
      mentionOpen = false;
      mentionFiltered = [];
      mentionAtPos = -1;
      renderMentionMenu();
    }

    function applyMention(idx) {
      const ta = $("task");
      const item = mentionFiltered[idx];
      if (!item || mentionAtPos < 0) {
        closeMentionMenu();
        return;
      }
      const val = ta.value;
      const cursor = ta.selectionStart;
      const insert = item.label || ("@" + item.id);
      const before = val.slice(0, mentionAtPos);
      const after = val.slice(cursor);
      ta.value = before + insert + (after.startsWith(" ") ? after : " " + after);
      const pos = before.length + insert.length + 1;
      ta.focus();
      ta.setSelectionRange(pos, pos);
      closeMentionMenu();
    }

    function updateMentionFromInput() {
      const ta = $("task");
      const pos = ta.selectionStart;
      const before = ta.value.slice(0, pos);
      const at = before.lastIndexOf("@");
      if (at < 0) {
        closeMentionMenu();
        return;
      }
      const chBefore = at === 0 ? " " : before[at - 1];
      if (chBefore && !/\s/.test(chBefore)) {
        closeMentionMenu();
        return;
      }
      const frag = before.slice(at + 1);
      if (/[\s]/.test(frag)) {
        closeMentionMenu();
        return;
      }
      mentionAtPos = at;
      mentionQuery = frag.toLowerCase();
      mentionFiltered = mentionTargets
        .filter((t) => {
          const id = String(t.id || "").toLowerCase();
          const label = String(t.label || "").toLowerCase();
          return !mentionQuery || id.includes(mentionQuery) || label.includes(mentionQuery);
        })
        .slice(0, 40);
      mentionIndex = 0;
      mentionOpen = mentionFiltered.length > 0;
      renderMentionMenu();
    }

    async function refreshFiles() {
      try {
        const r = await fetch("/api/files");
        const data = await r.json();
        const files = (data.files || []).filter((f) => !f.is_dir);
        $("fileCount").textContent = String(files.length);
        $("wsPath").textContent = data.workspace || "";
        mentionTargets = data.mentions || [];
        if (!autoTestUserTouched) {
          $("autoTest").checked = !!data.has_tests;
        }
        tree.innerHTML = "";
        if (!files.length) {
          tree.innerHTML = '<div class="viewer-empty">пусто</div>';
          return;
        }
        for (const f of files) {
          const item = document.createElement("div");
          item.className = "tree-item" + (currentFile === f.path ? " active" : "");
          item.dataset.path = f.path;
          item.textContent = "📄 " + f.path;
          item.title = f.path + " (" + f.size + " B)";
          tree.appendChild(item);
        }
      } catch (e) {
        tree.innerHTML = '<div class="viewer-empty">ошибка загрузки</div>';
      }
    }

    tree.addEventListener("click", (e) => {
      const item = e.target.closest(".tree-item");
      if (!item || !tree.contains(item)) return;
      const path = item.dataset.path;
      if (path) openFile(path);
    });

    function fmtBackupStamp(stamp, mtime) {
      if (stamp && stamp.length >= 15) {
        return stamp.slice(0, 4) + "-" + stamp.slice(4, 6) + "-" + stamp.slice(6, 8) +
          " " + stamp.slice(9, 11) + ":" + stamp.slice(11, 13) + ":" + stamp.slice(13, 15);
      }
      if (mtime) return fmtTime(mtime);
      return "";
    }

    async function refreshBackups() {
      try {
        const r = await fetch("/api/backups");
        const data = await r.json();
        const list = data.backups || [];
        $("backupCount").textContent = String(list.length);
        backupsEl.innerHTML = "";
        if (!list.length) {
          backupsEl.innerHTML = '<div class="viewer-empty">нет сохранённых версий</div>';
          return;
        }
        for (const b of list) {
          const row = document.createElement("div");
          row.className = "backup-item";
          const meta = document.createElement("div");
          meta.className = "backup-meta";
          meta.innerHTML =
            '<span class="orig" title="' + esc(b.name) + '">' + esc(b.original || b.name) + "</span>" +
            '<span class="stamp">' + esc(fmtBackupStamp(b.stamp, b.mtime)) +
            (b.size != null ? " · " + b.size + " B" : "") + "</span>";
          const btn = document.createElement("button");
          btn.textContent = "Откатить";
          btn.title = "Восстановить " + (b.original || "") + " из " + b.name;
          btn.onclick = () => rollbackBackup(b.name);
          row.appendChild(meta);
          row.appendChild(btn);
          backupsEl.appendChild(row);
        }
      } catch (e) {
        backupsEl.innerHTML = '<div class="viewer-empty">ошибка загрузки</div>';
      }
    }

    async function rollbackBackup(name) {
      if (!name) return;
      if (!confirm("Откатить файл к версии\n" + name + "?\nТекущая версия будет сохранена в бэкап.")) {
        return;
      }
      try {
        const r = await fetch("/api/rollback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ backup: name }),
        });
        const data = await r.json();
        if (!data.ok) {
          addCard({ cls: "error", icon: "⚠", title: "Rollback", body: data.error || "ошибка" });
          return;
        }
        addCard({
          cls: "result",
          icon: "⏪",
          title: "Rollback · " + (data.restored || ""),
          body: data.message || "OK",
        });
        refreshFiles();
        refreshBackups();
        if (data.restored) openFile(data.restored);
      } catch (e) {
        addCard({ cls: "error", icon: "⚠", title: "Rollback", body: String(e) });
      }
    }

    async function openFile(path) {
      currentFile = path;
      $("viewerTitle").textContent = path;
      try {
        const r = await fetch("/api/file?path=" + encodeURIComponent(path));
        const data = await r.json();
        if (data.error) {
          viewer.innerHTML = '<div class="viewer-empty">' + esc(data.error) + "</div>";
          $("btnCopy").disabled = true;
          return;
        }
        currentContent = data.content || "";
        const lines = currentContent.split("\n");
        const nums = lines.map((_, i) => (i + 1)).join("\n");
        viewer.innerHTML =
          '<div class="code-view">' +
            '<div class="line-nums">' + esc(nums) + "</div>" +
            '<div class="line-code">' + esc(currentContent) + "</div>" +
          "</div>";
        $("btnCopy").disabled = false;
        [...tree.querySelectorAll(".tree-item")].forEach((el) => {
          el.classList.toggle("active", el.textContent.includes(path));
        });
      } catch (e) {
        viewer.innerHTML = '<div class="viewer-empty">не удалось открыть</div>';
      }
    }

    $("btnCopy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(currentContent);
        $("btnCopy").textContent = "Скопировано";
        setTimeout(() => ($("btnCopy").textContent = "Копировать"), 1200);
      } catch (_) {
        $("btnCopy").textContent = "Ошибка";
      }
    };

    function handleEvent(ev) {
      const t = ev.type;
      const meta = (elapsed() ? elapsed() + " · " : "") + fmtTime(ev.ts);

      if (t === "hello" || t === "status") {
        if (typeof ev.running === "boolean") setRunning(ev.running);
        if (ev.workspace) $("wsPath").textContent = ev.workspace;
        if (ev.session) updateSessionHint(ev.session);
        return;
      }
      if (t === "model") {
        $("modelName").textContent = ev.id || "—";
        $("modelDot").className = "dot on";
        return;
      }
      if (t === "run_start") {
        if (!ev.follow_up) {
          feed.innerHTML = "";
          promptTokens = 0;
          completionTokens = 0;
          lastTokPerSec = null;
          lastThoughtKey = null;
        }
        runStart.t = Date.now();
        lastToolName = null;
        currentStep = 0;
        if (ev.max_steps) currentMaxSteps = ev.max_steps;
        updateTokens();
        updateStepHud(0, currentMaxSteps);
        setRunning(true);
        let startTitle = (ev.follow_up ? "↩ Follow-up · " : "▶ ") +
          (ev.mode || "run") + " · " + short(ev.task || "", 120);
        if (ev.models) {
          const m = ev.models;
          startTitle += " · A/C/R: " +
            short(m.architect || "?", 24) + " / " +
            short(m.coder || "?", 24) + " / " +
            short(m.reviewer || "?", 24);
        }
        addCard({ cls: "step", title: startTitle });
        return;
      }
      if (t === "sessions_changed") {
        refreshSessions();
        return;
      }
      if (t === "session_changes") {
        if (ev.session_id) activeSessionId = ev.session_id;
        updateChangesBar(ev.changes || {});
        return;
      }
      if (t === "auto_test" || t === "auto_test_start") {
        addCard({
          cls: ev.failed ? "error" : "step",
          icon: "🧪",
          title: t === "auto_test_start" ? "Auto-test: pytest…" : (ev.failed ? "Auto-test FAIL" : "Auto-test PASS"),
          body: typeof ev.result === "string" ? short(ev.result, 1200) : (ev.cmd || ""),
        });
        return;
      }
      if (t === "session") {
        updateSessionHint(ev);
        return;
      }
      if (t === "step") {
        updateStepHud(ev.step, ev.max_steps || currentMaxSteps);
        const speed = lastTokPerSec != null
          ? " · " + lastTokPerSec.toFixed(1) + " tok/s"
          : "";
        const label = ev.label || ("Шаг " + (ev.step || "?") +
          (ev.max_steps ? "/" + ev.max_steps : "") +
          (ev.agent ? " · " + ev.agent : "") + speed);
        addCard({ cls: "step", title: "—— " + label + " ——" });
        return;
      }
      if (t === "agent_role") {
        addCard({
          cls: "step",
          title: "▶ Роль: " + (ev.name || "") + " [" + (ev.tools || []).join(", ") + "]",
        });
        return;
      }
      if (t === "reasoning") {
        upsertReasoningCard(ev.content || "", {
          active: !!ev.active,
          agent: ev.agent || "",
          meta,
        });
        return;
      }
      if (t === "thought") {
        const key = (ev.agent || "") + "::" + String(ev.content || "").trim();
        if (key && key === lastThoughtKey) return;
        lastThoughtKey = key;
        if (activeReasoningEl) {
          const details = activeReasoningEl.querySelector("details");
          if (details) details.open = false;
          activeReasoningEl = null;
        }
        addCard({
          cls: "thought",
          icon: "💭",
          title: "Thought" + (ev.agent ? " · " + ev.agent : ""),
          body: short(ev.content, 2000),
          meta,
        });
        return;
      }
      if (t === "tool_call") {
        lastToolName = ev.name || null;
        addCard({
          cls: "tool",
          icon: "🔧",
          title: "Tool · " + (ev.name || "?"),
          body: short(JSON.stringify(ev.args || {}, null, 2), 2000),
          meta,
        });
        return;
      }
      if (t === "tool_result") {
        // run_command уже отрисован отдельной карточкой
        if (lastToolName === "run_command") {
          lastToolName = null;
          return;
        }
        lastToolName = null;
        addCard({
          cls: "result",
          icon: "✅",
          title: "Result",
          body: short(ev.result, 2500),
          meta,
        });
        return;
      }
      if (t === "file_change") {
        addCard({
          cls: "result",
          icon: "📝",
          title: "Diff · " + (ev.filename || "") + " (" + (ev.action || "") + ")",
          bodyHtml: makeUnifiedDiffHtml(ev.diff),
          meta,
        });
        refreshFiles();
        refreshBackups();
        if (currentFile && currentFile === ev.filename) openFile(ev.filename);
        return;
      }
      if (t === "files_changed") {
        refreshFiles();
        refreshBackups();
        return;
      }
      if (t === "run_command") {
        const res = ev.result || {};
        const ok = res.returncode === 0;
        addCard({
          cls: ok ? "result" : "error",
          icon: ok ? "🧪" : "💥",
          title: "run_command · " + short(ev.cmd || res.cmd || "", 60) +
            " → " + res.returncode +
            (res.duration_ms != null ? " (" + res.duration_ms + "ms)" : ""),
          body: short(
            (res.stdout ? "stdout:\n" + res.stdout + "\n" : "") +
            (res.stderr ? "stderr:\n" + res.stderr : "") +
            (res.error ? "\nerror: " + res.error : ""),
            3000
          ),
          meta,
        });
        return;
      }
      if (t === "tokens") {
        if (ev.total_prompt != null) promptTokens = ev.total_prompt;
        if (ev.total_completion != null) completionTokens = ev.total_completion;
        if (ev.tokens_per_sec != null) lastTokPerSec = Number(ev.tokens_per_sec);
        if (ev.prompt_tokens != null) lastPromptTokens = Number(ev.prompt_tokens);
        if (ev.context_limit != null) contextLimit = Number(ev.context_limit);
        updateTokens();
        const speed =
          ev.tokens_per_sec != null
            ? ", " + Number(ev.tokens_per_sec).toFixed(1) + " tok/s"
            : (ev.elapsed_sec != null ? ", " + ev.elapsed_sec + "s" : "");
        const ctx =
          ev.prompt_tokens != null
            ? "  |  ctx " + ev.prompt_tokens + "/" + (ev.context_limit || contextLimit) +
              (ev.context_pct != null ? " (" + ev.context_pct + "%)" : "")
            : "";
        addCard({
          cls: "tokens",
          icon: "Σ",
          title: "Tokens" + (ev.tokens_per_sec != null
            ? " · " + Number(ev.tokens_per_sec).toFixed(1) + " tok/s"
            : ""),
          body:
            "prompt +" + (ev.prompt_tokens ?? 0) +
            ", completion +" + (ev.completion_tokens ?? 0) +
            speed +
            "  |  total " + promptTokens + " / " + completionTokens +
            ctx,
          meta,
        });
        return;
      }
      if (t === "final") {
        if (activeReasoningEl) {
          const details = activeReasoningEl.querySelector("details");
          if (details) details.open = false;
          activeReasoningEl = null;
        }
        addCard({
          cls: "final",
          icon: "🏁",
          title: "Final" + (ev.agent ? " · " + ev.agent : ""),
          body: short(ev.content, 4000),
          meta,
        });
        return;
      }
      if (t === "error") {
        addCard({
          cls: "error",
          icon: "⚠",
          title: "Error",
          body: short(ev.message || "", 2000),
          meta,
        });
        return;
      }
      if (t === "run_end" || t === "stopped") {
        setRunning(false);
        addCard({
          cls: "step",
          title: "■ Завершено (" + (ev.status || ev.type) + ")" +
            (ev.code != null ? " code=" + ev.code : ""),
        });
        refreshFiles();
        refreshBackups();
        refreshModel();
        refreshSession();
        return;
      }
      if (t === "workspace" || t === "workspace_cleaned") {
        const next = ev.path || "";
        const prev = $("wsPath").textContent || "";
        $("wsPath").textContent = next;
        // workspace_cleaned — всегда обновить; workspace — только если путь сменился
        // (иначе /api/files ↔ SSE зацикливаются и клики по дереву ломаются)
        if (t === "workspace_cleaned" || next !== prev) {
          refreshFiles();
          refreshBackups();
        }
      }
    }

    async function refreshSession() {
      try {
        const r = await fetch("/api/session");
        const data = await r.json();
        updateSessionHint(data);
      } catch (_) {}
    }

    function connectSSE() {
      const es = new EventSource("/api/events");
      es.onopen = () => { $("connStatus").textContent = "SSE: connected"; };
      es.onerror = () => { $("connStatus").textContent = "SSE: reconnecting…"; };
      es.onmessage = (msg) => {
        try {
          handleEvent(JSON.parse(msg.data));
        } catch (_) {}
      };
    }

    $("presets").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-preset]");
      if (!btn) return;
      const key = btn.getAttribute("data-preset");
      const text = PRESETS[key];
      if (!text) return;
      const ta = $("task");
      ta.value = text;
      ta.focus();
      const pos = ta.value.length;
      ta.setSelectionRange(pos, pos);
    });

    $("autoTest").addEventListener("change", () => {
      autoTestUserTouched = true;
    });

    $("task").addEventListener("input", updateMentionFromInput);
    $("task").addEventListener("keydown", (e) => {
      if (!mentionOpen) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        mentionIndex = (mentionIndex + 1) % mentionFiltered.length;
        renderMentionMenu();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        mentionIndex = (mentionIndex - 1 + mentionFiltered.length) % mentionFiltered.length;
        renderMentionMenu();
      } else if (e.key === "Enter" || e.key === "Tab") {
        if (mentionFiltered.length) {
          e.preventDefault();
          applyMention(mentionIndex);
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        closeMentionMenu();
      }
    });
    $("task").addEventListener("blur", () => {
      setTimeout(closeMentionMenu, 150);
    });

    $("btnRevertSession").onclick = async () => {
      if (!activeSessionId) {
        addCard({ cls: "error", icon: "⚠", title: "Revert", body: "Нет активной сессии" });
        return;
      }
      if (!confirm("Откатить все изменения этой сессии к первому бэкапу каждого файла?")) return;
      try {
        const r = await fetch(
          "/api/sessions/" + encodeURIComponent(activeSessionId) + "/revert",
          { method: "POST" }
        );
        const data = await r.json();
        if (!data.ok && !(data.reverted && data.reverted.length)) {
          addCard({ cls: "error", icon: "⚠", title: "Revert", body: data.error || data.message || "ошибка" });
          return;
        }
        addCard({
          cls: "step",
          title: "↩ Revert All Session Changes",
          body: data.message || ("откат " + (data.reverted || []).length + " файл(ов)"),
        });
        updateChangesBar({ file_count: 0, added: 0, removed: 0, files: [] });
        refreshFiles();
        refreshBackups();
      } catch (e) {
        addCard({ cls: "error", icon: "⚠", title: "Revert", body: String(e) });
      }
    };

    $("btnRun").onclick = async () => {
      const task = $("task").value.trim();
      if (!task) {
        $("task").focus();
        return;
      }
      const maxSteps = parseInt($("maxSteps").value, 10) || 12;
      currentMaxSteps = maxSteps;
      updateStepHud(0, maxSteps);
      const payload = {
        mode: $("mode").value,
        task,
        workspace: $("workspace").value.trim() || "./sandbox",
        clean: $("clean").checked,
        auto_test: $("autoTest").checked,
        max_steps: maxSteps,
        base_url: getBaseUrl(),
      };
      if (payload.mode === "multi_agent") {
        const ma = ($("modelArchitect").value || "").trim();
        const mc = ($("modelCoder").value || "").trim();
        const mr = ($("modelReviewer").value || "").trim();
        if (ma) payload.model_architect = ma;
        if (mc) payload.model_coder = mc;
        if (mr) payload.model_reviewer = mr;
      }
      setRunning(true);
      try {
        const r = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!data.ok) {
          setRunning(false);
          addCard({ cls: "error", icon: "⚠", title: "Не запущено", body: data.error || r.statusText });
        } else {
          $("task").value = "";
        }
      } catch (e) {
        setRunning(false);
        addCard({ cls: "error", icon: "⚠", title: "Сеть", body: String(e) });
      }
    };

    $("btnNewSession").onclick = async () => {
      try {
        const r = await fetch("/api/session/reset", { method: "POST" });
        const data = await r.json();
        activeSessionId = null;
        updateSessionHint(data);
        updateChangesBar(null);
        feed.innerHTML = "";
        addCard({ cls: "step", title: "■ Новый сеанс — история диалога очищена" });
        refreshSessions();
      } catch (e) {
        addCard({ cls: "error", icon: "⚠", title: "Сеанс", body: String(e) });
      }
    };

    $("mode").addEventListener("change", toggleRoleModels);
    $("baseUrl").addEventListener("change", () => refreshModel());

    $("diffModalClose").onclick = closeDiffModal;
    $("diffModal").addEventListener("click", (e) => {
      if (e.target === $("diffModal")) closeDiffModal();
    });
    $("diffTabUnified").onclick = () => {
      diffModalMode = "unified";
      renderDiffModal();
    };
    $("diffTabSplit").onclick = () => {
      diffModalMode = "split";
      renderDiffModal();
    };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("diffModal").classList.contains("open")) {
        closeDiffModal();
      }
    });

    $("btnStop").onclick = async () => {
      try {
        await fetch("/api/stop", { method: "POST" });
      } catch (_) {}
    };

    $("workspace").addEventListener("change", async () => {
      try {
        await fetch("/api/workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ workspace: $("workspace").value.trim() }),
        });
        refreshFiles();
        refreshBackups();
      } catch (_) {}
    });

    feed.addEventListener("scroll", () => {
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
      autoScroll = nearBottom;
    });

    async function refreshStatus() {
      try {
        const r = await fetch("/api/status");
        const data = await r.json();
        if (data.context_limit) contextLimit = Number(data.context_limit);
        if (data.tokens && data.tokens.prompt != null) {
          lastPromptTokens = Number(data.tokens.prompt) || lastPromptTokens;
        }
        updateContextMeter(lastPromptTokens, contextLimit);
      } catch (_) {}
    }

    toggleRoleModels();
    refreshModel();
    refreshFiles();
    refreshBackups();
    refreshSession();
    refreshSessions();
    refreshStatus();
    connectSSE();
    setInterval(refreshModel, 15000);
  </script>
</body>
</html>
